name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: Pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dev dependencies
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    name: Frontend lint and type-check
    defaults:
      run:
        working-directory: lovelace-cards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lovelace-cards/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
